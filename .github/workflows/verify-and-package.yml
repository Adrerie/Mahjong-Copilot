name: Verify and package

on:
  push:
    branches:
      - main
      - 'plan/**'
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Test and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android debug APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu runners ship with Android SDK. Avoid setup-android@v3: it attempts
      # to install the obsolete SDK package 'tools' and fails before Gradle runs.
      - name: Check runner Android SDK
        run: test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - name: Synchronize Capacitor Android
        run: npx cap sync android
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mahjong-copilot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  signed_release:
    name: Build and verify signed release APK
    # Never expose signing credentials to pull requests or feature branches.
    # Main pushes produce a verifiable artifact; version tags additionally publish it.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify release version and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./package.json').version")"
          grep -Fq "versionName \"$expected_version\"" android/app/build.gradle
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$RELEASE_TAG" = "v$expected_version"
            git fetch origin main:refs/remotes/origin/main
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check runner Android SDK
        run: test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - name: Synchronize Capacitor Android
        run: npx cap sync android
      - name: Restore and validate signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $secret"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/mahjong-release.jks"
          test -s "$RUNNER_TEMP/mahjong-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/mahjong-release.jks" \
            -storepass:env ANDROID_STORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
      - name: Assemble signed release APK
        shell: bash
        env:
          MAHJONG_KEYSTORE_PATH: ${{ runner.temp }}/mahjong-release.jks
          MAHJONG_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MAHJONG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAHJONG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature, package, and version
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose "$apk"
          package_info="$("$build_tools/aapt" dump badging "$apk" | grep '^package:')"
          version="$(node -p "require('./package.json').version")"
          grep -Fq "name='com.karislin.mahjong'" <<< "$package_info"
          grep -Fq "versionName='$version'" <<< "$package_info"
          mkdir -p release-artifacts
          cp "$apk" "release-artifacts/Mahjong-Copilot-v${version}-release.apk"
          sha256sum "release-artifacts/Mahjong-Copilot-v${version}-release.apk"
      - name: Upload verified signed APK
        uses: actions/upload-artifact@v7
        with:
          name: mahjong-copilot-signed-release-apk
          path: release-artifacts/*-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mahjong-release.jks"

  release:
    name: Publish signed APK to GitHub Releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: signed_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mahjong-copilot-signed-release-apk
          path: release-artifacts
      - name: Publish verified signed prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="release-artifacts/Mahjong-Copilot-${RELEASE_TAG}-release.apk"
          test -s "$apk"
          gh release create "$RELEASE_TAG" "$apk" \
            --verify-tag --prerelease --latest=false \
            --title "Mahjong Copilot ${RELEASE_TAG} (Signed Beta)" \
            --generate-notes \
            --notes "Android Release APK, signed with the repository's configured signing key. Preserve the signing key for future in-place upgrades. Debug builds use a different key and cannot be upgraded in place without uninstalling (which removes locally stored app data)."
