name: Verify and package

on:
  push:
    branches:
      - main
      - 'plan/**'
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Test and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android debug APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu runners ship with Android SDK. Avoid setup-android@v3: it attempts
      # to install the obsolete SDK package 'tools' and fails before Gradle runs.
      - name: Check runner Android SDK
        run: test -d "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - name: Synchronize Capacitor Android
        run: npx cap sync android
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mahjong-copilot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged debug prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag matches version on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected"
          grep -Fq "versionName \"${RELEASE_TAG#v}\"" android/app/build.gradle
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@v8
        with:
          name: mahjong-copilot-debug-apk
          path: release-artifacts
      - name: Create prerelease with debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s release-artifacts/app-debug.apk
          output="release-artifacts/Mahjong-Copilot-${RELEASE_TAG}-debug.apk"
          mv release-artifacts/app-debug.apk "$output"
          gh release create "$RELEASE_TAG" "$output" \
            --verify-tag --prerelease --latest=false \
            --title "Mahjong Copilot ${RELEASE_TAG} (Debug Preview)" \
            --generate-notes \
            --notes "Android Debug APK for testing only. Not a signed production release; upgrades across CI builds may fail due to differing debug keys, and uninstalling the app removes locally saved data."
