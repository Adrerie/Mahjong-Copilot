<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f3f3f3"/>
    </linearGradient>
  </defs>
  <!-- tile background -->
  <rect x="64" y="64" width="896" height="896" rx="64" ry="64" fill="url(#g)" stroke="#e0e0e0" stroke-width="8"/>

  <!-- inner border -->
  <rect x="112" y="112" width="800" height="800" rx="48" ry="48" fill="none" stroke="#d0d0d0" stroke-width="6"/>

  <!-- pip / symbol: 红中 (red center) -->
  <g transform="translate(512,520) scale(3)">
    <path d="M-40 -80 L40 -80 L40 80 L-40 80 Z" fill="none" stroke="#d32f2f" stroke-width="12" stroke-linejoin="round"/>
    <text x="0" y="14" text-anchor="middle" font-size="150" font-family="Noto Sans SC, SimHei, Arial" fill="#d32f2f">中</text>
  </g>

  <!-- small diamonds top-left -->
  <g fill="#d32f2f" opacity="0.9">
    <rect x="160" y="160" width="28" height="28" rx="4" ry="4"/>
    <rect x="200" y="160" width="28" height="28" rx="4" ry="4"/>
  </g>

</svg>